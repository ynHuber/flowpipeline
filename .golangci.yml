version: "2"
output:
  formats:
    tab:
      path: stdout
formatters:
  enable:
    - gofmt
linters:
  enable:
    - decorder
    - embeddedstructfieldcheck
    - exhaustive
  disable:
    - errcheck
  exclusions:
    paths:
      - pb/
  settings:
    copyloopvar:
      check-alias: true
    embeddedstructfieldcheck:
      empty-line: false
    exhaustive:
      default-signifies-exhaustive: true
