name: Container build and publish

on:
  workflow_dispatch:
  release:
  push:
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
    paths:
      - .forgejo/**
      - Containerfile
      - examples/visualization/**

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: codeberg.org
  IMAGE_NAME: ${{ forge.repository }}
  IMAGE_NAME_VISUALIZATION: ${{ forge.repository }}-grafana


jobs:
  flowpipeline:

    runs-on: codeberg-small
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v5

      # Extract metadata (tags, labels) for Container
      - name: Extract Container metadata
        id: meta
        uses: https://code.forgejo.org/docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=${{ startsWith(forge.ref, 'refs/tags/') && ! endsWith(forge.ref, '-alpha') && ! endsWith(forge.ref, '-beta') }}

      # Build and push Container image with Kaniko (don't push on PR)
      - name: Build and push Container image
        uses: https://codeberg.org/umglurf/kaniko-action@v1.4.3
        with:
          docker_file: Containerfile
          credentials: ${{ env.REGISTRY }}=${{ forge.repository_owner }}:${{ secrets.CODEBERG_PACKAGE_REPOSITORY_TOKEN }}
          destinations: ${{ steps.meta.outputs.tags }}
          push: ${{ forge.event_name != 'pull_request' }}

  visualization:

    needs: flowpipeline
    runs-on: codeberg-small
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v5

      # Extract metadata (tags, labels) for Container
      - name: Extract Container metadata
        id: meta
        uses: https://code.forgejo.org/docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_VISUALIZATION }}
          flavor: latest=${{ startsWith(forge.ref, 'refs/tags/') && ! endsWith(forge.ref, '-alpha') && ! endsWith(forge.ref, '-beta') }}

      # Build and push Container image with Kaniko (don't push on PR)
      - name: Build and push Container image
        uses: https://codeberg.org/umglurf/kaniko-action@v1.4.3
        with:
          docker_file: examples/visualization/Containerfile
          credentials: ${{ env.REGISTRY }}=${{ forge.repository_owner }}:${{ secrets.CODEBERG_PACKAGE_REPOSITORY_TOKEN }}
          destinations: ${{ steps.meta.outputs.tags }}
          push: ${{ forge.event_name != 'pull_request' }}
          extra_args: '--compressed-caching=false'
