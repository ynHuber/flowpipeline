name: Linting

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  lint-go:
    permissions:
      contents: read
    runs-on: BelWü
    steps:
      - name: checkout
        uses: https://code.forgejo.org/actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: setup go
        id: setup-go
        uses: https://code.forgejo.org/actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: 'go.mod'

      - name: install libpcap
        if: ${{ steps.setup-go.outputs.cache-hit != 'true' }}
        run: apt-get update && apt-get install -y libpcap-dev

      - name: golangci-lint
        uses: https://github.com/golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest
          skip-cache: true

  lint-commits:
    runs-on: BelWü
    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install commitlint
        run: npm install --save-dev @commitlint/config-conventional @commitlint/cli

      - name: Validate PR commits with commitlint
        run: npx commitlint --config .forgejo/workflows/.commitlintrc.json --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
