name: Test main and PRs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    permissions:
      contents: read
      checks: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: codeberg-small
          goos: linux
        #- os: macos-latest
          #goos: darwin
    steps:
    - name: checkout
      uses: https://code.forgejo.org/actions/checkout@v5

    - name: install libpcap
      if: matrix.goos == 'linux'
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev

    - name: setup go
      uses: https://code.forgejo.org/actions/setup-go@v5
      with:
        go-version: '1.24.0'

    - name: test
      run: go test ./...

    - name: build
      run: go build -o flowpipeline -ldflags "-X main.Version=${{ forge.sha }}" .

    - name: save binary
      uses: https://code.forgejo.org/forgejo/upload-artifact/@v4
      with:
        name: flowpipeline-${{ matrix.goos }}
        path: ./flowpipeline
        overwrite: true

    - name: build statically linked
      run: go build -o flowpipeline-static -ldflags "-X main.Version=${{ forge.sha }}" .
      env:
        CGO_ENABLED: 0

    - name: save statically linked binary
      uses: https://code.forgejo.org/forgejo/upload-artifact/@v4
      with:
        name: flowpipeline-${{ matrix.goos }}-static
        path: ./flowpipeline-static
        overwrite: true
